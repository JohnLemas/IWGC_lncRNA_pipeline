# ============================================================================
# lncRNA Annotation Pipeline - Configuration
# Edit THIS file to point the pipeline at a new species/dataset.
# The Snakefile itself should not need to change between runs.
# ============================================================================

# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------
species: "species"          # short abbreviation used in filenames/logs (e.g. "osat", "zmays")
base_dir: "/mnt/scratch/lemasjoh/BASF/IWGC_lncRNA_pipeline"   # top-level project directory
scripts_dir: "/mnt/scratch/lemasjoh/BASF/IWGC_lncRNA_pipeline/scripts"  # custom scripts (feelnc, R scripts, PlantLncBoost, etc.)
bind_dir: "/mnt/scratch/lemasjoh"   # path bound into singularity containers with -B

# ---------------------------------------------------------------------------
# Sample sheet
# ---------------------------------------------------------------------------
# Plain text file, one sample ID per line. Works for SRA accessions
# (SRR1234567) or arbitrary tissue-based sample names (e.g. LEAF_rep1) -
# the pipeline only cares that raw fastq files are named "<ID>_1.fastq.gz" /
# "<ID>_2.fastq.gz" (paired) or "<ID>.fastq.gz" / "<ID>_1.fastq.gz" (single).
samples_file: "01_inputs/{species}_sample_IDs.txt"

# ---------------------------------------------------------------------------
# Reference inputs
# ---------------------------------------------------------------------------
reference:
  genome_fasta: "01_inputs/{species}.chromosomes.fa"

  # Gene model annotation - must already be a GTF (used for STAR indexing,
  # StringTie -G, and FEELnc filter/classify -a). If you only have a GFF3,
  # convert it first: gffread your_annotation.gff3 -T -o {species}_mRNA.gtf
  annotation_gtf: "01_inputs/{species}_mRNA.gtf"

  # Species-specific CDS/protein sequences (from the same annotation).
  # Used to build an extra DIAMOND database so DIAMOND flags coding
  # candidates by similarity to genes actually predicted in this genome,
  # in addition to (or instead of) UniProt.
  cds_fasta: "01_inputs/{species}_cds.fa"
  protein_fasta: "01_inputs/{species}_protein.fa"

# ---------------------------------------------------------------------------
# Raw RNA-seq inputs
# ---------------------------------------------------------------------------
raw_fastq_dir: "01_inputs/raw_fastq"

# ---------------------------------------------------------------------------
# Library prep
# ---------------------------------------------------------------------------
library:
  # "unstranded" | "RF" (fr-firststrand, e.g. dUTP/NEBNext Ultra II Directional)
  # | "FR" (fr-secondstrand)
  # Original pipeline effectively assumed unstranded data (STAR
  # --outSAMstrandField intronMotif infers strand from splice motifs).
  # For non-model species / RiboZero data, confirm this against your library
  # prep kit or run RSeQC infer_experiment.py on a STAR BAM before trusting
  # single-exon lncRNA calls - mono-exonic transcripts have no splice motif
  # for STAR to infer strand from, so unstranded assumptions can mis-strand
  # or drop them.
  strandedness: "unstranded"

# ---------------------------------------------------------------------------
# UniProt DIAMOND database (general protein-homology filter)
# ---------------------------------------------------------------------------
uniprot_diamond_db: "/mnt/scratch/lemasjoh/BASF/uniprot_db/uniprot_out.dmnd"

# ---------------------------------------------------------------------------
# Transposable-element annotation (EDTA output), used to annotate lncRNA
# proximity/overlap alongside FEELnc_classify. Expected as a simple BED:
# chrom  start  end  TE_id_or_family (tab-separated, no header).
# If you only have EDTA's native GFF3, convert first, e.g.:
#   awk 'BEGIN{OFS="\t"}!/^#/{print $1,$4-1,$5,$3}' species.EDTA.TEanno.gff3 > TE.bed
# ---------------------------------------------------------------------------
te_bed: "01_inputs/{species}_TE.bed"

# ---------------------------------------------------------------------------
# Output/log directory layout (relative to base_dir/species)
# ---------------------------------------------------------------------------
dirs:
  inputs:          "01_inputs"
  fastp:           "03_outputs/01_fastp"
  star:            "03_outputs/02_STAR"
  stringtie:       "03_outputs/03_stringtie"
  stringtie_asm:   "03_outputs/03_stringtie/SRR_assemblies"
  gffread:         "03_outputs/04_gffread"
  feelnc:          "03_outputs/05_FEELnc"
  cpat:            "03_outputs/06_cpat"
  lncboost:        "03_outputs/07_lncBoost"
  lncfinder:       "03_outputs/08_lncFinder"
  diamond:         "03_outputs/09_diamond"
  intersect:       "03_outputs/10_intersect"
  classify:        "03_outputs/11_classify"
  te_intersect:    "03_outputs/12_TE_intersect"
logs_dir: "/mnt/scratch/lemasjoh/BASF/logs"

# ---------------------------------------------------------------------------
# Bundled tool scripts (relative to scripts_dir / base_dir)
# ---------------------------------------------------------------------------
tool_paths:
  feelnc_dir: "scripts/feelnc"                        # contains lib/ and scripts/FEELnc_filter.pl, FEELnc_classifier.pl
  lncfinder_rscript: "scripts/lncFinder.R"
  intersect_ids_rscript: "scripts/intersect_ids.R"
  classifications_rscript: "scripts/classifications.R"

# ---------------------------------------------------------------------------
# Singularity images
# ---------------------------------------------------------------------------
containers:
  feelnc:     "def_files/FEELnc.sif"
  cpat:       "def_files/cpat_plant.sif"
  lncboost:   "def_files/plant_lnc_boost.sif"
  rbio_tools: "def_files/rbio_tools_v2.sif"   # lncFinder.R, intersect_ids.R, classifications.R

# ---------------------------------------------------------------------------
# HPC environment modules (used via Snakemake's `envmodules:` directive;
# run snakemake with --use-envmodules for these to take effect)
# ---------------------------------------------------------------------------
envmodules:
  fastp:      "Miniforge3"       # activated via `conda run -n fastp`, see rule fastp_*
  fastp_env:  "fastp"            # name of the conda env containing fastp
  star:       "STAR/2.7.11b-GCC-13.2.0"
  samtools:   "SAMtools/1.19.2-GCC-13.2.0"
  stringtie:  "StringTie/2.2.1-GCC-11.2.0-Python-2.7.18"
  gffread:    "gffread"
  diamond:    "DIAMOND/2.1.8-GCC-12.3.0"
  seqkit:     "SeqKit"
  bedtools:   "BEDTools"

# ---------------------------------------------------------------------------
# Tool parameters
# ---------------------------------------------------------------------------
params:
  fastp:
    threads: 8

  star_index:
    threads: 8
    sjdbOverhang: 99
    genomeSAindexNbases: 13

  star_align:
    threads: 8

  bam_index:
    threads: 1

  stringtie_assemble:
    threads: 8
    min_transcript_len: 200
    min_junction_cov: 2

  stringtie_merge:
    threads: 4
    min_transcript_len: 200

  feelnc_filter:
    threads: 20
    monoex: -1        # --monoex ; -1 keeps monoexonic candidates
    min_size: 200      # -s

  feelnc_classifier:
    threads: 4
    window: 10000      # -w
    max_dist: 100000    # -m

  cpat:
    threads: 16
    hexamer_table: "scripts/Plant-LncRNA-pipeline-v2/Model/Plant_Hexamer.tsv"
    logit_model: "scripts/Plant.logit.v2.RData"

  lncboost:
    threads: 20
    threshold: 0.5
    script_dir: "scripts/Plant-LncRNA-pipeline-v2/PlantLncBoost/Script"
    model: "scripts/Plant-LncRNA-pipeline-v2/Model/PlantLncBoost_model.cb"

  lncfinder:
    threads: 32
    frequencies_file: "wheat"   # LncFinder built-in model; swap if a closer relative's model exists
    svm_model: "wheat"

  diamond:
    threads: 32
    evalue: 1.0e-5
    max_target_seqs: 1
    sensitivity: "--sensitive"
    use_species_db: true    # build & search a species-specific DB from protein_fasta, combine with UniProt hits

  intersect:
    threads: 4

  classify:
    threads: 4

  te_intersect:
    threads: 1